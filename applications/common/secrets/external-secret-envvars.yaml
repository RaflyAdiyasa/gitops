apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-go-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backend-go-secrets  # Nama Kubernetes Secret yang akan dibuat
    creationPolicy: Owner
  data:
    - secretKey: APP_DB_URL
      remoteRef:
        key: secret/backend-go/dev  # Kita override path ini per environment di kustomization.yaml
        property: APP_DB_URL
    - secretKey: APP_DB_PASSWORD
      remoteRef:
        key: secret/backend-go/dev
        property: APP_DB_PASSWORD
    - secretKey: APP_JWT_SECRET
      remoteRef:
        key: secret/backend-go/dev
        property: APP_JWT_SECRET
    - secretKey: APP_SECRET_KEY
      remoteRef:
        key: secret/backend-go/dev
        property: APP_SECRET_KEY
    - secretKey: APP_NEWRELIC_KEY
      remoteRef:
        key: secret/backend-go/dev
        property: APP_NEWRELIC_KEY
