apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          # Per-environment role: backend-go-dev, backend-go-staging, or backend-go-prod.
          # Kita overide role ini di Kustomize overlay.
          role: "backend-go-dev"
          serviceAccountRef:
            name: backend-go
